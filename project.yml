name: LidarTerrain
options:
  bundleIdPrefix: com.walkassist
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
targets:
  LidarTerrain:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkassist.LidarTerrain
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    scheme:
      testTargets: []
